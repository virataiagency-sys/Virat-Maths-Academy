plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viratmathsacademy.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.viratmathsacademy.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Web Host for Trusted Web Activity verification
        resValue "string", "hostName", "ais-pre-bvm4l3uzdxsaajuxzpwmgh-694768886112.asia-east1.run.app"
        resValue "string", "defaultUrl", "https://ais-pre-bvm4l3uzdxsaajuxzpwmgh-694768886112.asia-east1.run.app"
        resValue "string", "appName", "Virat Maths Academy"
        resValue "string", "launcherName", "ViratMaths"
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.material:material:1.11.0'
}
