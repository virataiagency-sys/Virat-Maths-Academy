<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Math Geometry Orbits in Background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(129, 140, 248, 0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(244, 63, 94, 0.1)" stroke-width="2"/>
  <polygon points="256,90 390,320 122,320" fill="none" stroke="rgba(192, 132, 252, 0.12)" stroke-width="2"/>

  <!-- Stylized Monogram "V" for Virat Maths Academy -->
  <path d="M 128 140 L 220 370 Q 256 430 292 370 L 384 140 Q 394 116 368 116 Q 346 116 338 136 L 256 340 L 174 136 Q 166 116 144 116 Q 118 116 128 140 Z" 
        fill="url(#vGrad)" filter="url(#glow)"/>

  <!-- Math Symbols Accents -->
  <!-- Pi symbol top right -->
  <text x="360" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" opacity="0.9">π</text>
  <!-- Sigma symbol top left -->
  <text x="110" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" opacity="0.9">∑</text>
  <!-- Square root / infinity at bottom -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#e2e8f0" letter-spacing="4">VIRAT MATHS</text>
</svg>
